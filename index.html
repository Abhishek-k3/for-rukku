<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rukku</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>Rukku & Abhishek</h1>
            <p>Our story, one chapter at a time.</p>
            <div class="scroll-indicator">↓</div>
        </div>
    </section>

    <div class="timeline-container">
        <div class="timeline-line"></div>

        <div class="milestone">
            <div class="polaroid-card" style="transform: rotate(-2deg);">
                <img src="images/first-meeting.jpg" alt="Our Beginning">
                <p class="caption">Where it all began...</p>
            </div>
        </div>

        <div class="milestone">
            <div class="polaroid-card" style="transform: rotate(2deg);">
                <img src="images/madurai.jpg" alt="Madurai Trip">
                <p class="caption">Seeking blessings in Madurai.</p>
            </div>
        </div>
        
        </div>

    <div class="diya-section">
        <div id="diya" class="diya">🪔</div>
        <p>Tap to light our path</p>
    </div>

    <div class="secret-vault">
        <button id="unlock-btn">A Secret for You</button>
        <div id="letter" class="hidden-letter">
            <p>Rukku, you are my greatest blessing...</p>
            </div>
    </div>

    <audio id="bg-music" src="garaj-garaj.mp3" loop></audio>
    <button id="music-toggle">❤️</button>

    <script src="script.js"></script>
</body>
</html>
