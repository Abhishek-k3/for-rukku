<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#FDF5E6"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="placeholderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#4A0404;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#placeholderGradient)"/>
  
  <!-- Center content -->
  <g>
    <!-- Diamond shape -->
    <path d="M 800 200 L 900 450 L 800 700 L 700 450 Z" fill="#D4AF37" opacity="0.3"/>
    
    <!-- Text -->
    <text x="800" y="480" font-family="'Playfair Display', serif" font-size="56" font-weight="bold" fill="#4A0404" text-anchor="middle">
      Your Photo Here
    </text>
    
    <text x="800" y="560" font-family="'Lora', serif" font-size="32" fill="#4A0404" opacity="0.6" text-anchor="middle">
      Add images to gallery folder
    </text>
    
    <!-- Bottom decoration -->
    <circle cx="800" cy="800" r="40" fill="#D4AF37" opacity="0.2"/>
    <circle cx="760" cy="800" r="20" fill="#D4AF37" opacity="0.15"/>
    <circle cx="840" cy="800" r="20" fill="#D4AF37" opacity="0.15"/>
  </g>
</svg>
